services:
  postgres:
    image: postgres:16
    container_name: special-date-reminder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: specialdate
      POSTGRES_PASSWORD: specialdate
      POSTGRES_DB: special_date_reminder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
